version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_USER: platform_admin
      POSTGRES_DB: product_db
      POSTGRES_PASSWORD: platform_admin
      TZ: Europe/Kyiv
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      -
volumes:
  postgres_data:
