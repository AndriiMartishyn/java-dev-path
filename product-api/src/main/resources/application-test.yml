spring:
  application:
    name: product-api


  datasource:
    url: jdbc:postgresql://localhost:5432/product_db?serverTimezone=Europe/Kyiv
    username: platform_admin
    password: platform_admin

  jpa:
    hibernate:

      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    # locations: classpath:db/migration # If necessary.
    baseline-on-migrate: true
    baseline-version: 1

